[project]
name = "hhu-campusnetwork-autologin"
version = "0.2.0"
description = "Bounded Windows login and own-session recovery for the HHU campus portal."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Krual", email = "shaokun.tang@outlook.com" }]
dependencies = ["python-dotenv>=1.0", "requests>=2.32"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "requests-mock>=1.12", "ruff>=0.9", "pyinstaller>=6"]

[tool.uv]
managed = true
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
